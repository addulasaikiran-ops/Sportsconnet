name: SportsConnect Monitoring

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sportsconnect-monitoring
  cancel-in-progress: false

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Check application, Supabase, and latency
        id: check
        continue-on-error: true
        env:
          SPORTSCONNECT_BASE_URL: ${{ secrets.SPORTSCONNECT_BASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: node scripts/monitor.mjs
      - name: Send email alert
        if: steps.check.outputs.alert_required == 'true'
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: ${{ secrets.ALERT_SMTP_SERVER }}
          server_port: ${{ secrets.ALERT_SMTP_PORT }}
          username: ${{ secrets.ALERT_SMTP_USERNAME }}
          password: ${{ secrets.ALERT_SMTP_PASSWORD }}
          subject: "[SportsConnect] Monitoring incident detected"
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: ${{ secrets.ALERT_EMAIL_FROM }}
          body: |
            SportsConnect monitoring detected an issue.

            Details: ${{ steps.check.outputs.monitor_summary }}

            Check the hosting logs, Supabase status, and Sentry for more details:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            This alert excludes secrets and raw request data.
      - name: Send recovery email
        if: steps.check.outputs.recovery_required == 'true'
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: ${{ secrets.ALERT_SMTP_SERVER }}
          server_port: ${{ secrets.ALERT_SMTP_PORT }}
          username: ${{ secrets.ALERT_SMTP_USERNAME }}
          password: ${{ secrets.ALERT_SMTP_PASSWORD }}
          subject: "[SportsConnect] Monitoring recovered"
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: ${{ secrets.ALERT_EMAIL_FROM }}
          body: |
            SportsConnect health checks have recovered.

            Details: ${{ steps.check.outputs.monitor_summary }}

            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: Fail workflow when monitor detects an incident
        if: steps.check.outcome == 'failure'
        run: exit 1
