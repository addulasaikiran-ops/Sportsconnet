name: SportsConnect Monitoring

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: sportsconnect-monitoring
  cancel-in-progress: false

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check application, database, and latency
        id: check
        env:
          MONITOR_BASE_URL: ${{ secrets.MONITOR_BASE_URL }}
        run: |
          set +e
          if [ -z "$MONITOR_BASE_URL" ]; then
            echo "failure=MONITOR_BASE_URL secret is not configured" >> "$GITHUB_OUTPUT"
            echo "elapsed_ms=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          url="${MONITOR_BASE_URL%/}/api/health"
          result=$(curl --silent --show-error --max-time 15 --output /tmp/health.json --write-out '%{http_code} %{time_total}' "$url" 2>/tmp/curl-error.txt)
          curl_status=$?
          http_code=$(echo "$result" | awk '{print $1}')
          elapsed=$(echo "$result" | awk '{print $2}')
          elapsed_ms=$(awk -v t="${elapsed:-0}" 'BEGIN { printf "%d", t * 1000 }')
          echo "elapsed_ms=$elapsed_ms" >> "$GITHUB_OUTPUT"
          echo "http_code=${http_code:-000}" >> "$GITHUB_OUTPUT"

          if [ "$curl_status" -ne 0 ]; then
            echo "failure=Health endpoint request failed: $(cat /tmp/curl-error.txt)" >> "$GITHUB_OUTPUT"
          elif [ "$http_code" != "200" ]; then
            echo "failure=Health endpoint returned HTTP $http_code" >> "$GITHUB_OUTPUT"
          elif [ "$elapsed_ms" -gt 2000 ]; then
            echo "failure=Health endpoint latency exceeded 2000ms (${elapsed_ms}ms)" >> "$GITHUB_OUTPUT"
          else
            echo "failure=" >> "$GITHUB_OUTPUT"
          fi

          if [ -f /tmp/health.json ]; then
            echo "Health response (safe summary):"
            node -e 'const h=require("/tmp/health.json"); console.log(JSON.stringify({ok:h.ok, service:h.service, checks:h.checks, timestamp:h.timestamp}))' || true
          fi

      - name: Send email alert
        if: steps.check.outputs.failure != ''
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: ${{ secrets.ALERT_SMTP_SERVER }}
          server_port: ${{ secrets.ALERT_SMTP_PORT }}
          username: ${{ secrets.ALERT_SMTP_USERNAME }}
          password: ${{ secrets.ALERT_SMTP_PASSWORD }}
          subject: "[SportsConnect] Monitoring alert"
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: ${{ secrets.ALERT_EMAIL_FROM }}
          body: |
            SportsConnect monitoring detected a problem.

            Reason: ${{ steps.check.outputs.failure }}
            HTTP status: ${{ steps.check.outputs.http_code }}
            Measured latency (ms): ${{ steps.check.outputs.elapsed_ms }}
            Repository: ${{ github.repository }}
            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Check the hosting logs, Supabase status, and Sentry for more details.
            This email may contain operational details; do not forward it publicly.
